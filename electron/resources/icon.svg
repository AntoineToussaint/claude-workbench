<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feOffset dx="0" dy="4" in="shadow" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="1016" height="1016" rx="218" ry="218" fill="none" stroke="#2a2a30" stroke-width="2"/>

  <!-- Parallel bars representing Claude Code instances -->
  <g filter="url(#shadow)">
    <!-- Blue bar -->
    <line x1="240" y1="362" x2="784" y2="362" stroke="#3B82F6" stroke-width="60" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

    <!-- Green bar -->
    <line x1="280" y1="452" x2="744" y2="452" stroke="#22C55E" stroke-width="60" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

    <!-- Red bar -->
    <line x1="220" y1="542" x2="804" y2="542" stroke="#EF4444" stroke-width="60" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

    <!-- Yellow bar -->
    <line x1="300" y1="632" x2="724" y2="632" stroke="#F59E0B" stroke-width="60" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  </g>
</svg>
